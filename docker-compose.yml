services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: ./apps/gateway
    ports:
      - "8000:8000"
    environment:
      - ANONYMIZATION_SERVICE_HOST=anonymization_service
      - ANONYMIZATION_SERVICE_PORT=8001
      - AI_SERVICE_HOST=ai_service
      - AI_SERVICE_PORT=8002
      - PUBMED_SERVICE_HOST=pubmed_service
      - PUBMED_SERVICE_PORT=8003
      - AUTH_SERVICE_HOST=auth_service
      - AUTH_SERVICE_PORT=8005
      - PATIENT_SERVICE_HOST=patient_service
      - PATIENT_SERVICE_PORT=8006
      - SESSION_SERVICE_HOST=session_service
      - SESSION_SERVICE_PORT=8007
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - anonymization_service
      - ai_service
      - pubmed_service
      - auth_service
      - patient_service
      - session_service

  anonymization_service:
    build: ./services/anonymization_service
    expose:
      - "8001"

  ai_service:
    build: ./services/ai_service
    expose:
      - "8002"

  pubmed_service:
    build: ./services/pubmed_service
    expose:
      - "8003"
    environment:
      - NCBI_API_KEY=${NCBI_API_KEY}

  auth_service:
    build: ./services/auth_service
    expose:
      - "8005"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  session_service:
    build: ./services/session_service
    expose:
      - "8007"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  patient_service:
    build: ./services/patient_service
    expose:
      - "8006"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
