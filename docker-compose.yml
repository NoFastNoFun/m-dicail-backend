services:
  gateway:
    build: ./apps/gateway
    ports:
      - "8000:8000"
    environment:
      - ANONYMIZATION_SERVICE_HOST=anonymization_service
      - ANONYMIZATION_SERVICE_PORT=8001
      - AI_SERVICE_HOST=ai_service
      - AI_SERVICE_PORT=8002
      - PUBMED_SERVICE_HOST=pubmed_service
      - PUBMED_SERVICE_PORT=8003
      - REPORT_SERVICE_HOST=report_service
      - REPORT_SERVICE_PORT=8004
      - AUTH_SERVICE_HOST=auth_service
      - AUTH_SERVICE_PORT=8005
      - PROTOCOL_SERVICE_HOST=protocol_service
      - PROTOCOL_SERVICE_PORT=8006
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      - anonymization_service
      - ai_service
      - pubmed_service
      - report_service
      - auth_service
      - protocol_service

  anonymization_service:
    build: ./services/anonymization_service
    expose:
      - "8001"

  ai_service:
    build: ./services/ai_service
    expose:
      - "8002"

  pubmed_service:
    build: ./services/pubmed_service
    expose:
      - "8003"

  report_service:
    build: ./services/report_service
    expose:
      - "8004"

  auth_service:
    build: ./services/auth_service
    expose:
      - "8005"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=sqlite:////app/auth.db

  protocol_service:
    build: ./services/protocol_service
    expose:
      - "8006"
    environment:
      - DATABASE_URL=sqlite:////app/protocols.db
