syntax = "proto3";

package anonymization;

service AnonymizationService {
  rpc Anonymize(AnonymizeRequest) returns (AnonymizeResponse);
}

message AnonymizeRequest {
  string text = 1;
  string language = 2;
}

message AnonymizeResponse {
  string anonymized_text = 1;
  repeated DetectedEntity entities = 2;
}

message DetectedEntity {
  string label = 1;
  string original_value = 2;
  string placeholder = 3;
  int32 start = 4;
  int32 end = 5;
}
