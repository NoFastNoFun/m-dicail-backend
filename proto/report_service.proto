syntax = "proto3";

package report;

service ReportService {
  rpc Generate(ReportGenerateRequest) returns (ReportGenerateResponse);
}

message ReportGenerateRequest {
  string session_id = 1;
  string content = 2;
  string format = 3;
}

message ReportGenerateResponse {
  bytes report_data = 1;
  string format = 2;
  string filename = 3;
}
