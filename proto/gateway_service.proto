syntax = "proto3";

package gateway;

option py_generic_services = false;

// Called by the Flutter frontend
service GatewayService {
  rpc ProcessNote(ProcessNoteRequest) returns (ProcessNoteResponse);
  rpc GetRecommendations(RecommendationRequest) returns (RecommendationResponse);
  rpc GenerateReport(ReportRequest) returns (ReportResponse);
}

message ProcessNoteRequest {
  string raw_text = 1;
  string session_id = 2;
  string language = 3;
}

message ProcessNoteResponse {
  string session_id = 1;
  string anonymized_text = 2;
  string ai_response = 3;
}

message RecommendationRequest {
  string session_id = 1;
  string clinical_context = 2;
  string language = 3;
}

message RecommendationResponse {
  string session_id = 1;
  string summary = 2;
  repeated string recommendations = 3;
  repeated string sources = 4;
}

message ReportRequest {
  string session_id = 1;
  string content = 2;
  string format = 3; // "text" or "pdf"
}

message ReportResponse {
  string session_id = 1;
  bytes report_data = 2;
  string format = 3;
}
