syntax = "proto3";

package ai;

service AIService {
  rpc Generate(AIRequest) returns (AIResponse);
}

message AIRequest {
  string anonymized_text = 1;
  string clinical_context = 2;
  string pubmed_results = 3;
  string language = 4;
}

message AIResponse {
  string summary = 1;
  repeated string recommendations = 2;
  repeated string exercises = 3;
  string evidence_level = 4;
  repeated string sources = 5;
  string precautions = 6;
}
